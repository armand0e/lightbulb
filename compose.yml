services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: bgutil-provider
    restart: always

  blackbulb:
    build:
      context: ./blackbulb
      dockerfile: Dockerfile
    image: blackbulb
    container_name: blackbulb
    restart: always
    depends_on:
      - bgutil-provider
    environment:
      - BLACKBULB_BOT_TOKEN
      - YTDLP_POT_PROVIDER_URL=http://bgutil-provider:4416

  lightbulb:
    build:
      context: ./lightbulb
      dockerfile: Dockerfile
    image: lightbulb
    container_name: lightbulb
    restart: always
    depends_on:
      - bgutil-provider
    environment:
      - LIGHTBULB_BOT_TOKEN
      - YTDLP_POT_PROVIDER_URL=http://bgutil-provider:4416
